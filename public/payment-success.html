<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b2e">
  <title>تم الدفع — تحدي التخاطر</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Tajawal',sans-serif;background:radial-gradient(ellipse 120% 80% at 50% -20%,#2d1b69 0%,#0a0618 55%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .box{max-width:440px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:32px 24px;text-align:center;backdrop-filter:blur(12px)}
    .icon{font-size:3rem;margin-bottom:12px}
    h1{font-size:1.5rem;margin-bottom:10px}
    p{color:rgba(255,255,255,.65);line-height:1.7;font-size:.95rem;margin-bottom:20px}
    .order-id{direction:ltr;font-family:ui-monospace,monospace;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.35);padding:12px;border-radius:12px;margin:16px 0;font-weight:800}
    .status{font-size:.88rem;color:#4ade80;margin-bottom:8px;min-height:22px}
    .status.wait{color:#fbbf24}
    a.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;text-decoration:none;font-weight:700;margin-top:8px}
    .primary{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}
    .secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>تم الدفع بنجاح!</h1>
    <p id="statusText">جاري تفعيل بطاقاتك تلقائياً — ستظهر في حسابك خلال ثوانٍ.</p>
    <div class="status wait" id="fulfillStatus">⏳ جاري التفعيل...</div>
    <div class="order-id" id="orderId">—</div>
    <a href="/my" class="btn primary" id="myLink">👤 افتح حسابي — بطاقاتي</a>
    <a href="/" class="btn secondary">🏠 الرئيسية</a>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script src="/js/codes.js?v=115"></script>
  <script src="/js/account.js?v=115"></script>
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      const orderId = p.get('order') || '';
      if (orderId) document.getElementById('orderId').textContent = orderId;

      const statusEl = document.getElementById('fulfillStatus');
      const textEl = document.getElementById('statusText');
      const myLink = document.getElementById('myLink');

      if (!orderId) {
        statusEl.textContent = '';
        return;
      }

      TPCodes.init();
      const db = firebase.database();
      let tries = 0;
      const maxTries = 30;

      function onFulfilled() {
        statusEl.className = 'status';
        statusEl.textContent = '✓ تم تفعيل البطاقات في حسابك';
        textEl.textContent = 'يمكنك البدء فوراً من تبويب «بطاقاتي» في حسابك.';
        myLink.textContent = '🎮 افتح بطاقاتي والعب الآن';
      }

      function pollCustomerOrder(pk) {
        tries += 1;
        db.ref('customerOrders/' + pk + '/' + orderId).once('value').then((snap) => {
          const o = snap.val();
          if (o && o.status === 'fulfilled') {
            onFulfilled();
            return;
          }
          if (tries >= maxTries) {
            statusEl.className = 'status wait';
            statusEl.textContent = 'قد يستغرق التفعيل دقيقة — افتح حسابك';
            return;
          }
          setTimeout(() => pollCustomerOrder(pk), 2000);
        }).catch(() => {
          if (tries < maxTries) setTimeout(() => pollCustomerOrder(pk), 2500);
        });
      }

      async function tryClaimFulfillment() {
        try {
          if (typeof firebase.functions !== 'function') return false;
          // Region MUST match functions/index.js FN_REGION — default region
          // callable would 404 and silently skip the fulfillment claim.
          const fn = firebase.app().functions('us-central1').httpsCallable('claimOrderFulfillment');
          const res = await fn({ orderId: orderId });
          const data = res && res.data;
          if (data && data.ok && data.status === 'fulfilled') return true;
        } catch (_) {}
        return false;
      }

      firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) {
          statusEl.textContent = 'سجّل دخولك في /my لرؤية البطاقات';
          return;
        }
        try {
          await tryClaimFulfillment();
          const customer = await TPAccount.resolveLoggedInCustomer();
          const pk = customer && customer.phoneKey;
          if (pk) pollCustomerOrder(pk);
        } catch (_) {
          statusEl.textContent = 'افتح حسابك لرؤية البطاقات';
        }
      });
    })();
  </script>
</body>
</html>
