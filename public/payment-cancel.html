<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b2e">
  <title>إلغاء الدفع — تحدي التخاطر</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Tajawal',sans-serif;background:radial-gradient(ellipse 120% 80% at 50% -20%,#2d1b69 0%,#0a0618 55%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .box{max-width:440px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:32px 24px;text-align:center}
    h1{font-size:1.4rem;margin-bottom:10px}
    p{color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:20px}
    a.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;text-decoration:none;font-weight:700;margin-top:8px}
    .primary{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}
    .secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
  </style>
</head>
<body>
  <div class="box">
    <h1>❌ تم إلغاء الدفع</h1>
    <p>لم يتم خصم أي مبلغ. يمكنك المحاولة مجدداً أو الدفع عبر واتساب.</p>
    <a href="/#pricing" class="btn primary">🛒 العودة للباقات</a>
    <a href="/my" class="btn secondary">👤 حسابي</a>
  </div>
</body>
</html>
